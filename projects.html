<!DOCTYPE html>
<html lang="en" data-theme="light" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Projects | Presley Mayer - Personal Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg site-nav sticky-top">
    <div class="container">
      <a class="navbar-brand" href="index.html">Presley Mayer - Personal Portfolio</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="skills.html">Skills</a></li>
          <li class="nav-item"><a class="nav-link" href="experience.html">Experience</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="projects.html">Projects</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          <li class="nav-item ms-lg-3">
            <button id="themeToggle" class="btn theme-toggle" type="button" aria-label="Switch to dark mode">
              <i class="bi bi-moon-stars"></i>
            </button>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="section">
    <div class="container">
      <header class="page-header">
        <h1>My Projects</h1>
        <p>Deliverables from my internships, classes, and side work. Select a project to see more details!</p>
      </header>

      <div class="d-flex flex-column flex-md-row gap-3 justify-content-between align-items-md-center mb-4">
        <div id="filterButtons" class="d-flex flex-wrap gap-2" role="group" aria-label="Filter projects by category"></div>
        <input id="projectSearch" type="search" class="form-control search-box" placeholder="Search projects" aria-label="Search projects">
      </div>

      <div id="projectGrid" class="row g-4"></div>
      <p id="projectMessage" class="project-message d-none"></p>
    </div>

   
    <div class="modal fade" id="projectModal" tabindex="-1" aria-labelledby="projectModalTitle" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title h5" id="projectModalTitle"></h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
          </div>
          <div class="modal-body">
            <p class="modal-category" id="projectModalCategory"></p>
            <p id="projectModalDetails"></p>
            <div id="projectModalTech" class="d-flex flex-wrap gap-2"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container d-flex flex-column flex-md-row justify-content-between gap-2">
      <span>&copy; <span id="year"></span> Presley Mayer</span>
      <span>Built with HTML, CSS, JavaScript, and Bootstrap</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
